version: '3.8'

services:
  smart-greenhouse:
    build: .
    container_name: smart-greenhouse
    ports:
      - "8080:8080"
    volumes:
      # Mount thư mục dữ liệu để SQLite không bị mất khi restart container
      - ./simulator/dulieu_nhakinh.db:/app/simulator/dulieu_nhakinh.db
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
