<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>AI Camera - Teachable Machine</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
    <style>
        body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }

        #webcam-container {
            margin: 20px 0;
            border: 3px solid var(--color-primary);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            min-width: 400px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-panel {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #label-container div {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .label-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .progress-bar-bg {
            width: 100%;
            background: var(--bg-main);
            border-radius: 5px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--color-primary);
            transition: width 0.2s ease-out;
        }

        .status {
            margin-top: 15px;
            font-weight: 600;
            color: var(--color-moisture);
            text-align: center;
            font-size: 1.1rem;
        }

        input[type="text"] {
            background: var(--bg-main);
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }

        .btn-primary {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center; margin-bottom: 5px;">🤖 Camera Nhận Diện Cây</h1>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 20px;">Sử dụng Google Teachable Machine để
        đánh giá và gửi kết quả về Hệ thống giả lập (MQTT).</p>

    <div class="control-panel">
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.9rem; font-weight: 600;">Adafruit IO Username:</label>
            <input type="text" id="aio-user" style="width: 100%; padding: 10px; margin-top: 5px;"
                placeholder="Ví dụ: myusername">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.9rem; font-weight: 600;">Adafruit IO Key:</label>
            <input type="password" id="aio-key"
                style="width: 100%; padding: 10px; margin-top: 5px; background: var(--bg-main); border: 1px solid #444; color: #fff; border-radius: 6px;"
                placeholder="aio_xxxxxxxxxxxxxxx">
        </div>
        <div>
            <label style="font-size: 0.9rem; font-weight: 600;">Link Model Teachable Machine:</label>
            <input type="text" id="model-url" style="width: 100%; padding: 10px; margin-top: 5px;"
                value="https://teachablemachine.withgoogle.com/models/hFjVe1EyC/">
            <small style="color: var(--text-muted); display: block; margin-top: 5px;">* Chú ý: URL Model bắt buộc phải
                có dấu / ở cuối.</small>
        </div>
        <button id="btn-start" class="btn-primary" onclick="init()">Bật Camera & Bắt Đầu Nhận Diện</button>
    </div>

    <div id="webcam-container">
        <span style="color: #666;">Khu vực hiển thị Camera</span>
    </div>

    <div class="control-panel">
        <h3 style="margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px;">Kết Quả Phân Tích:</h3>
        <div id="label-container"></div>
        <div id="mqtt-status" class="status">Chưa kết nối MQTT...</div>
    </div>

    <script>
        // Lấy thông tin từ sessionStorage nếu có (từ tab chính) để điền sẵn
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = sessionStorage.getItem('aio_username');
            if (savedUser) {
                document.getElementById('aio-user').value = savedUser;
            }
        });

        const CONFIG = {
            username: '',
            key: '',
            feedCmd: 'ai-command'
        };

        let model, webcam, labelContainer, maxPredictions;
        let mqttClient = null;
        let lastPublish = 0;
        const PUBLISH_INTERVAL = 10000; // Gửi 10 giây/lần để tránh bị khóa tài khoản (Rate Limit)

        function connectMQTT() {
            CONFIG.username = document.getElementById('aio-user').value.trim();
            CONFIG.key = document.getElementById('aio-key').value.trim();

            if (!CONFIG.username || !CONFIG.key) {
                document.getElementById('mqtt-status').innerText = "⚠️ Lỗi: Vui lòng nhập đầy đủ Username và Key Adafruit IO!";
                document.getElementById('mqtt-status').style.color = "var(--color-alert)";
                return false;
            }

            document.getElementById('mqtt-status').innerText = "⏳ Đang kết nối MQTT Broker...";

            const options = {
                username: CONFIG.username,
                password: CONFIG.key,
                protocolVersion: 4,
                clean: true,
                reconnectPeriod: 5000
            };

            mqttClient = mqtt.connect(`wss://io.adafruit.com:443/mqtt`, options);

            mqttClient.on('connect', () => {
                document.getElementById('mqtt-status').innerText = "✅ Đã kết nối MQTT Broker thành công!";
                document.getElementById('mqtt-status').style.color = "var(--color-moisture)";
            });

            mqttClient.on('error', (err) => {
                console.error(err);
                document.getElementById('mqtt-status').innerText = "❌ Lỗi kết nối MQTT!";
                document.getElementById('mqtt-status').style.color = "var(--color-alert)";
                
                if (err.message && err.message.includes('authorized')) {
                    document.getElementById('mqtt-status').innerText = "❌ Sai Username hoặc Key! Vui lòng F5.";
                    mqttClient.end();
                }
            });

            return true;
        }

        async function init() {
            if (!connectMQTT()) return;

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').innerText = "Đang khởi động Camera...";

            const URL = document.getElementById('model-url').value;
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // Load model
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Setup webcam
                const flip = true;
                webcam = new tmImage.Webcam(400, 400, flip);
                await webcam.setup(); // request access to the webcam
                await webcam.play();
                window.requestAnimationFrame(loop);

                // Gắn canvas vào DOM
                const wc = document.getElementById("webcam-container");
                wc.innerHTML = ""; // Clear placeholder
                wc.appendChild(webcam.canvas);

                // Tao UI danh sach classes
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const div = document.createElement("div");
                    div.innerHTML = `
                        <div class="label-header">
                            <span class="label-name"></span>
                            <span class="label-pct"></span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar" style="width:0%"></div>
                        </div>
                    `;
                    labelContainer.appendChild(div);
                }

                document.getElementById('btn-start').innerText = "Đang chạy Nhận diện AI...";
            } catch (err) {
                console.error(err);
                alert("Lỗi tải Model Teachable Machine. Vui lòng kiểm tra link.");
                document.getElementById('btn-start').disabled = false;
                document.getElementById('btn-start').innerText = "Thử lại";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let bestClass = "";
            let bestProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                const prob = prediction[i].probability;
                const name = prediction[i].className;

                labelContainer.childNodes[i].querySelector('.label-name').innerText = name;
                labelContainer.childNodes[i].querySelector('.label-pct').innerText = (prob * 100).toFixed(1) + "%";
                labelContainer.childNodes[i].querySelector('.progress-bar').style.width = (prob * 100) + "%";

                if (prob > bestProb) {
                    bestProb = prob;
                    bestClass = name;
                }
            }

            // Gửi dữ liệu qua MQTT nếu độ tin cậy > 70% và đã qua 10 giây
            const now = Date.now();
            if (bestProb > 0.7 && (now - lastPublish > PUBLISH_INTERVAL) && mqttClient && mqttClient.connected) {
                const payload = JSON.stringify({ class: bestClass, confidence: bestProb });
                const topic = `${CONFIG.username}/feeds/${CONFIG.feedCmd}`;

                mqttClient.publish(topic, payload, { qos: 1 });

                document.getElementById('mqtt-status').innerText = `📡 Vừa gửi: [${bestClass}] (${(bestProb * 100).toFixed(0)}%) lên MQTT`;
                lastPublish = now;
            }
        }
    </script>
</body>

</html>
